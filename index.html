## 🏢 표준 가맹 절차 초안

**1. 창업 문의 및 1차 상담**
홈페이지, 전화 등을 통해 문의를 남겨주시면 담당자가 브랜드 소개, 개설 조건, 예상 창업 비용 등을 상세히 안내해 드립니다.

**2. 상권 분석 및 점포 개발**
창업 희망 지역의 상권과 유동 인구를 분석하고, 수익성을 고려하여 최적의 점포를 추천 및 선정합니다. (기존 보유 점포가 있을 경우 상권 타당성 분석 진행)

**3. 가맹 계약 체결**
최종 점포가 확정되면 본사와 가맹 계약을 체결합니다. 이때 정보공개서를 제공받고 가맹비 등 초기 비용을 납부하게 됩니다.

**4. 인테리어 설계 및 시공**
브랜드 표준 매뉴얼에 맞춘 인테리어 설계 도면을 확정하고, 본격적인 매장 시공 및 필수 장비 세팅을 진행합니다.

**5. 가맹점주 및 직원 교육**
시공이 진행되는 동안 본사 교육장 또는 직영점에서 조리(제조), 매장 운영 노하우, 고객 서비스(CS), 마케팅 등 실무 밀착 교육을 실시합니다.

**6. 최종 점검 및 가오픈**
인테리어 완공 후 각종 설비의 정상 작동 여부를 점검합니다. 이후 가오픈을 통해 실제 운영 동선을 체크하고 미흡한 부분을 보완합니다.

**7. 그랜드 오픈 및 사후 관리**
